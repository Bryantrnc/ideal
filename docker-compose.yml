services:
  ideal-web:
    build:
      context: ./frontend/ideal-web
      dockerfile: Dockerfile
    container_name: ideal-web
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - ideal-api
    volumes:
      - ./frontend/ideal-web:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}

  ideal-api:
    build:
      context: ./backend/ideal-api
      dockerfile: Dockerfile
    container_name: ideal-api
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - ideal-db
    volumes:
      - ./backend/ideal-api:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: ideal-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ideal_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

  ideal-db:
    image: mysql:8.4
    container_name: ideal-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ideal_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - ideal-db-data:/var/lib/mysql

volumes:
  ideal-db-data:
